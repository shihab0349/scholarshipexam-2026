<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scholarship Exam 2026 - Authentic Foundation</title>
<style>
:root{--bg:#f1f5fb;--card:#fff;--text:#14213d;--muted:#5b6b86;--line:#d9e1ef;--accent:#e9b949;--btn1:#2358d8;--btn2:#183a94;--shadow:0 10px 30px rgba(20,33,61,.12)}
:root[data-theme="dark"]{--bg:#000;--card:#10151f;--text:#e8edf7;--muted:#93a1ba;--line:#273044;--shadow:0 10px 30px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .25s,color .25s}
header{background:linear-gradient(135deg,#0c1b3d,#1f4796);color:#fff;text-align:center;padding:22px 16px 70px;position:relative;z-index:0}
.logo{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--bg);margin:0 auto 10px;border:3px solid var(--bg)}
.logo img{width:100%;height:100%;object-fit:cover;transform:scale(1.1);display:block}
header h1{margin:0;font-size:1.7rem}
header p{margin:6px 0 0;opacity:.9}
#theme{position:fixed;top:12px;right:12px;z-index:60;border:1px solid rgba(255,255,255,.45);background:rgba(12,27,61,.85);color:#fff;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:.85rem}
main{max-width:640px;margin:-34px auto 0;padding:0 14px 40px;position:relative;z-index:1}
.card{background:var(--card);border-radius:22px;padding:22px 18px;box-shadow:var(--shadow)}
.note{background:var(--card);border-left:4px solid var(--accent);border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{font-size:1.15rem;margin:26px 0 12px;padding-left:10px;border-left:4px solid var(--accent)}
h2:first-child{margin-top:0}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:.95rem}
input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--card);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:2px solid #2358d8;border-color:transparent}
textarea{min-height:90px;resize:vertical}
button.submit{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;color:#fff;font-size:1.05rem;font-weight:700;background:linear-gradient(135deg,var(--btn1),var(--btn2));cursor:pointer}
button.submit:disabled{opacity:.6;cursor:wait}
.hint{color:var(--muted);font-size:.85rem;margin-top:14px}
#err{color:#d33;margin-top:12px;font-weight:600;display:none}
footer{text-align:center;color:var(--muted);margin-top:22px;font-size:.9rem}
#done{display:none}
#done h2.t{border:0;padding:0;font-size:1.5rem;text-align:center;margin:0 0 8px}
#doneMsg{text-align:center;margin:0 0 20px;line-height:1.5}
body.done header{display:none}
body.done main{margin-top:0;padding-top:64px}
.slider{touch-action:pan-x pan-y;overflow-x:auto;overflow-anchor:none;padding:6px 2px 18px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.track{display:flex;gap:14px;width:max-content}
.s{flex:0 0 240px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;box-shadow:0 6px 0 var(--line),var(--shadow)}
.s img,.s .ph{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--line);display:block;margin:0 auto 10px}
.s b{display:block}.s small{display:block;color:var(--muted);margin:4px 0 8px}.s p{margin:0;font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.arrows{display:none;justify-content:center;gap:12px}.arrows button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1.4rem;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.mc{position:relative;background:var(--card);color:var(--text);border-radius:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto;padding:26px 20px;text-align:center;box-shadow:var(--shadow)}
.mc img,.mc .ph{width:200px;height:200px;max-width:70%;border-radius:50%;object-fit:cover;background:var(--line);display:block;margin:0 auto 14px}
.mc b{font-size:1.3rem;display:block}.mc small{display:block;color:var(--muted);margin:6px 0 12px;font-size:.95rem}.mc p{margin:0;white-space:pre-wrap;line-height:1.5}
.mc .x{position:absolute;top:8px;right:10px;border:0;background:none;color:var(--text);font-size:1.6rem;cursor:pointer}
.fb{display:flex;align-items:center;gap:14px;margin-top:18px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);text-decoration:none;box-shadow:var(--shadow)}
.fb svg{width:44px;height:44px;flex:none}.fb span{font-weight:700;font-size:1.05rem}
</style>
</head>
<body>
<header>
  <button id="theme" type="button">Dark mode</button>
  <div class="logo"><img src="logo.jpg" alt="Authentic Foundation logo"></div>
  <h1>Scholarship Exam - 2026</h1>
  <p>Organised by <b>AUTHENTIC FOUNDATION</b></p>
  <p>Please fill out the form below to register</p>
</header>

<main>
  <div id="topNote" class="note" style="display:none"></div>

  <form id="f" class="card" novalidate>
    <h2>Personal Information</h2>
    <label>Student's Name *</label><input name="name" placeholder="Enter full name" required>
    <label>Father's Name *</label><input name="father" placeholder="Father's full name" required>
    <label>Mother's Name *</label><input name="mother" placeholder="Mother's full name" required>

    <h2>SSC Information</h2>
    <label>SSC Institution *</label><input name="sscInst" placeholder="Institution name" required>
    <label>SSC Group *</label>
    <select name="sscGroup" required><option value="">Select group</option><option>Science</option><option>Business Studies</option><option>Humanities</option><option>General</option></select>
    <label>GPA Obtained *</label><input name="sscGpa" inputmode="decimal" placeholder="e.g. 5.00" required>

    <h2>HSC Information</h2>
    <label>HSC Institution *</label><input name="hscInst" placeholder="Institution name" required>
    <label>HSC Current Group *</label>
    <select name="hscGroup" required><option value="">Select group</option><option>Science</option><option>Business Studies</option><option>Humanities</option><option>General</option></select>

    <h2>Contact Information</h2>
    <label>Address *</label><textarea name="address" placeholder="Village/Area, Upazila, District" required></textarea>
    <label>Mobile Number *</label><input name="mobile" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX" required>

    <div id="err"></div>
    <button class="submit" id="btn" type="submit">Submit</button>
    <p class="hint">* All marked fields are required.</p>
  </form>

  <section id="done" class="card">
    <h2 class="t" id="doneTitle"></h2>
    <p id="doneMsg"></p>
    <div id="showWrap" style="display:none"><div class="slider" id="slider"><div class="track" id="track"></div></div><div class="arrows" id="arrows"><button type="button" id="prev" aria-label="Previous">&#8249;</button><button type="button" id="next" aria-label="Next">&#8250;</button></div></div>
    <a id="fb" class="fb" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#1877F2"/><path fill="#fff" d="M26.6 38V26.2h4l.6-4.6h-4.6v-2.9c0-1.3.4-2.2 2.3-2.2h2.4v-4.1c-.4-.1-1.9-.2-3.5-.2-3.5 0-5.9 2.1-5.9 6v3.4h-4v4.6h4V38h4.7z"/></svg>
      <span id="fbName"></span>
    </a>
  </section>
  <footer>Student Registration Portal</footer>
  <div class="modal" id="modal"><div class="mc" id="mc"></div></div>
</main>

<script>
/* ===== PUT YOUR APPS SCRIPT WEB APP URL HERE ===== */
const API_URL = "https://script.google.com/macros/s/AKfycbxNUhjVqXwI1qALRQlQpIGRXJW3bw_9aC_EHHLHUO4lXMUnuT0MNEx3MoAH2ajOvE57/exec";

const $ = s => document.querySelector(s);
let CONFIG = null;

/* ---- theme (auto from device, toggle to override) ---- */
function applyTheme(t){document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'Light mode':'Dark mode';try{localStorage.setItem('theme',t)}catch(e){}}
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
applyTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#theme').onclick=()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ---- load settings ---- */
function cleanHtml(h){
  h=String(h||'');
  if(!/<[a-z][\s\S]*>/i.test(h)) return esc(h).replace(/\n/g,'<br>');
  const doc=new DOMParser().parseFromString('<body>'+h+'</body>','text/html');
  const OK={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,BR:1,DIV:1,P:1,SPAN:1};
  const PROP=/^(color|background-color|font-size|font-weight|font-style|text-decoration|text-decoration-line|text-align)$/;
  const VAL=/^[#\w\s.,()%-]+$/;
  (function walk(n){
    [...n.childNodes].forEach(c=>{
      if(c.nodeType===3) return;
      if(c.nodeType!==1){c.remove();return}
      if(!OK[c.tagName]){walk(c);while(c.firstChild)c.parentNode.insertBefore(c.firstChild,c);c.remove();return}
      [...c.attributes].forEach(a=>{if(a.name!=='style')c.removeAttribute(a.name)});
      if(c.hasAttribute('style')){
        const keep=[];
        c.getAttribute('style').split(';').forEach(d=>{const i=d.indexOf(':');if(i<0)return;const k=d.slice(0,i).trim().toLowerCase(),v=d.slice(i+1).trim();if(PROP.test(k)&&VAL.test(v)&&!/url|expression|import/i.test(v))keep.push(k+':'+v)});
        keep.length?c.setAttribute('style',keep.join(';')):c.removeAttribute('style');
      }
      walk(c);
    });
  })(doc.body);
  return doc.body.innerHTML;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
fetch(API_URL).then(r=>r.json()).then(d=>{
  CONFIG=d.config;
  if(CONFIG.topNote){const n=$('#topNote');n.innerHTML=cleanHtml(CONFIG.topNote);n.style.display='block'}
}).catch(()=>{});

/* ---- submit with retry (safe: same ID is never saved twice) ---- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function send(data){
  let last='Network problem. Please try again.';
  for(let i=0;i<5;i++){
    try{
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'submit',data})});
      const j=await r.json();
      if(j.ok) return j;
      if(!/lock|timed out|busy/i.test(j.error||'')) throw new Error(j.error);   // real validation error: stop
      last=j.error;
    }catch(e){ if(e.message && !/fetch|network|json|load/i.test(e.message)) throw e; }
    await sleep(1500*(i+1)+Math.random()*1000);
  }
  throw new Error(last);
}

const id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2));

$('#f').addEventListener('submit',async e=>{
  e.preventDefault();
  const err=$('#err');err.style.display='none';
  const d=Object.fromEntries(new FormData(e.target));
  d.id=id;
  for(const k of ['name','father','mother','sscInst','sscGroup','sscGpa','hscInst','hscGroup','address','mobile'])
    if(!String(d[k]||'').trim()) return show('Please fill in all required fields.');
  const g=parseFloat(d.sscGpa); if(!(g>=1&&g<=5)) return show('GPA must be between 1.00 and 5.00.');
  if(!/^01\d{9}$/.test(d.mobile)) return show('Enter a valid 11-digit mobile number (01XXXXXXXXX).');
  const b=$('#btn');b.disabled=true;b.textContent='Submitting...';
  try{ await send(d); showDone(); }
  catch(x){ show(x.message||'Something went wrong. Please try again.'); b.disabled=false;b.textContent='Submit'; }
  function show(m){err.textContent=m;err.style.display='block'}
});

/* ---- success screen ---- */
let LIST=[],modalOpen=false;
async function showDone(){
  if(!CONFIG){try{CONFIG=(await (await fetch(API_URL)).json()).config}catch(e){CONFIG={}}}
  $('#f').style.display='none';$('#topNote').style.display='none';
  $('#doneTitle').textContent=CONFIG.successTitle||'Thank you!';
  $('#doneMsg').innerHTML=cleanHtml(CONFIG.successMessage||'');
  document.body.classList.add('done');
  $('#fb').href=CONFIG.fbLink||'#';$('#fbName').textContent=CONFIG.fbName||'Facebook';
  $('#done').style.display='block';
  LIST=CONFIG.showcase||[];
  if(LIST.length){
    $('#track').innerHTML=LIST.map((s,i)=>`<div class="s" data-i="${i}">${s.photo?`<img src="${esc(s.photo)}" alt="">`:'<div class="ph"></div>'}<b>${esc(s.name)}</b><small>${esc(s.qualification)}</small><p>${esc(s.text)}</p></div>`).join('');
    $('#showWrap').style.display='block';
    $('#track').onclick=e=>{const c=e.target.closest('.s');if(c)openModal(+c.dataset.i)};
    startSlider();
  }
  scrollTo({top:0,behavior:'smooth'});
}

/* ---- enlarged card ---- */
function openModal(i){
  const s=LIST[i];if(!s)return;
  const big=s.photo?s.photo.replace('sz=w500','sz=w900'):'';
  $('#mc').innerHTML=`<button class="x" type="button" aria-label="Close">&times;</button>${big?`<img src="${esc(big)}" alt="">`:'<div class="ph"></div>'}<b>${esc(s.name)}</b><small>${esc(s.qualification)}</small><p>${esc(s.text)}</p>`;
  $('#modal').style.display='flex';modalOpen=true;
}
function closeModal(){$('#modal').style.display='none';modalOpen=false}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.classList.contains('x'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---- slider: auto-moves right every 5s, user can also scroll/swipe or use arrows ---- */
let pauseUntil=0;
function startSlider(){
  const sl=$('#slider'),t=$('#track');
  const step=()=>t.firstElementChild.offsetWidth+14;
  if(t.children.length<2) return;
  $('#arrows').style.display='flex';
  const pause=()=>{pauseUntil=Date.now()+8000};
  ['touchstart','wheel','pointerdown'].forEach(ev=>sl.addEventListener(ev,pause,{passive:true}));
  $('#prev').onclick=()=>{pause();sl.scrollBy({left:-step(),behavior:'smooth'})};
  $('#next').onclick=()=>{pause();sl.scrollBy({left:step(),behavior:'smooth'})};
  /* mouse drag (touch screens already swipe natively) */
  let down=false,sx=0,s0=0,moved=false;
  sl.style.cursor='grab';
  sl.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;moved=false;sx=e.clientX;s0=sl.scrollLeft});
  addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5)moved=true;sl.scrollLeft=s0-dx});
  addEventListener('pointerup',()=>{down=false});
  sl.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
  setInterval(()=>{
    if(Date.now()<pauseUntil||modalOpen||t.scrollWidth<=sl.clientWidth+4) return;
    const w=step();
    if(sl.scrollLeft>w/2){sl.scrollBy({left:-w,behavior:'smooth'});return}
    t.prepend(t.lastElementChild);
    sl.scrollLeft=w;
    sl.scrollTo({left:0,behavior:'smooth'});
  },5000);
}
</script>
</body>
</html>
